# Default configuration for WaveletDiff training
# This file contains all hyperparameters and settings

# Training configuration
training:
  epochs: 5000
  batch_size: 512
  save_model: true
  
# Model architecture (large size)
model:
  embed_dim: 256
  num_heads: 8
  num_layers: 8
  time_embed_dim: 128
  dropout: 0.1
  prediction_target: "noise"  # "noise" or "coefficient"

# Cross-level attention
attention:
  use_cross_level_attention: true

# Energy term configuration
energy:
  weight: 0.0

# Sampling configuration
sampling:
  method: "t-edm"          # "ddpm", "ddim", "t-edm"
  ddim_eta: 0.0            # Stochasticity parameter for DDIM (0.0=deterministic, 1.0=stochastic)
  ddim_steps: 50           # steps for ddim, ignored for others
  exploration_ratio: 0.3   # Ratio of adaptive vs Min-SNR probability (for HybridSampler)
  adaptive_start_pct: 0.8  # Fraction of pct_start where adaptive sampling kicks in (e.g. 0.8)
  eval_method: "t-edm"     # Default method for inline evaluation during training


# Quarter-window conditioning & Classifier-Free Guidance
conditioning:
  cfg_dropout_prob: 0.15  # Probability of dropping all conditions during training
  guidance_scale: 1.0     # CFG guidance scale at inference (1.0=no guidance, >1.0=stronger)
  quarter_conditions: true

# Data configuration
data:
  normalize_data: true
  data_dir: "../data"

# Optimizer and scheduler
optimizer:
  scheduler_type: "onecycle"  # "cosine_warmup", "plateau_warmup", "onecycle", "cosine", "plateau"
  warmup_epochs: 50
  max_lr: 0.0002
  start_lr: 1e-5
  final_lr: 1e-6
  pct_start: 0.3

# Dataset configuration (can be overridden by dataset-specific configs)
dataset:
  name: "etth1"
  seq_len: 24

# Evaluation configuration
evaluation:
  num_samples: 20000
  # Inline evaluation during training
  inline_eval_every_n_epochs: 200
  inline_eval_n_samples: 500
  
# Output paths
paths:
  output_dir: "../outputs"
